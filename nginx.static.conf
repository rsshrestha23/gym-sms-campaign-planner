# Default config baked into the web image: static dashboard only, unprivileged port.
# In Kubernetes the ingress routes API paths to the api Service; docker compose mounts
# nginx.conf (which also proxies the API) over this file.
server {
  listen 8080;
  root /usr/share/nginx/html;

  location / {
    try_files $uri /index.html;
  }
}
