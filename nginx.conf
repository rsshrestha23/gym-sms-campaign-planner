server {
  listen 80;
  root /usr/share/nginx/html;

  # Versioned API paths (/v1/...) and the unversioned v1 alias are forwarded unchanged.
  location ~ ^/(v[0-9]+/)?campaigns/[^/]+/events$ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location ~ ^/(v[0-9]+(/|$)|campaigns/|webhooks/|health$) {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
