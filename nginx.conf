# docker compose only (mounted over the image's static config).
# Round-robin across API replicas; SSE clients on either one get every update via Redis.
upstream api_upstream {
  server api:3000;
  server api-2:3000;
}

server {
  listen 8080;
  root /usr/share/nginx/html;

  # Versioned API paths (/v1/...) and the unversioned v1 alias are forwarded unchanged.
  location ~ ^/(v[0-9]+/)?campaigns/[^/]+/events$ {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location ~ ^/(v[0-9]+(/|$)|campaigns/|webhooks/|health(/(live|ready))?$) {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri /index.html;
  }
}
