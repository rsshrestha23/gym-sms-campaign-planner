# Local production-like topology. Secrets here are development values only.
x-server: &server
  build:
    context: .
    dockerfile: Dockerfile.api
  restart: unless-stopped
  environment: &server-env
    DATABASE_URL: postgres://gym:gym@db:5432/gym
    REDIS_URL: redis://redis:6379
    SMS_PROVIDER_ACCOUNT: default
    LOG_LEVEL: info

services:
  db:
    image: postgres:16-alpine
    # Docker's 64MB /dev/shm default is too small for parallel queries/VACUUM on millions of rows.
    shm_size: 512mb
    environment:
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gym
      POSTGRES_DB: gym
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym -d gym"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    # BullMQ requires noeviction; AOF so queued jobs survive a Redis restart.
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    <<: *server
    environment:
      <<: *server-env
      PORT: "3000"
      WEBHOOK_SIGNING_SECRETS: dev-only-webhook-secret
      WEBHOOK_RATE_LIMIT_PER_SECOND: "3000"
      ADMIN_API_TOKEN: dev-admin-token
    ports:
      - "3000:3000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Migrations + seed run before listen, so a passing readiness check means the campaign is ready.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  # Second API replica behind nginx: proves SSE fan-out across instances via Redis Pub/Sub.
  api-2:
    <<: *server
    environment:
      <<: *server-env
      PORT: "3000"
      RUN_MIGRATIONS: "false"
      SEED_DEMO_DATA: "false"
      WEBHOOK_SIGNING_SECRETS: dev-only-webhook-secret
      WEBHOOK_RATE_LIMIT_PER_SECOND: "3000"
      ADMIN_API_TOKEN: dev-admin-token
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 30

  dispatcher:
    <<: *server
    command: ["node", "build/dispatcher/src/main.js"]
    depends_on:
      api: { condition: service_healthy }

  relay:
    <<: *server
    command: ["node", "build/dispatcher/src/relay-main.js"]
    depends_on:
      api: { condition: service_healthy }

  worker:
    <<: *server
    command: ["node", "build/workers/src/main.js"]
    deploy:
      replicas: 2
    stop_grace_period: 30s
    environment:
      <<: *server-env
      SMS_PROVIDER: http
      SMS_PROVIDER_URL: http://mock-provider:4010/messages
      SMS_PROVIDER_API_KEY: mock-provider-key
      WORKER_CONCURRENCY: "20"
      PROVIDER_RATE_LIMIT_PER_SECOND: "50"
    depends_on:
      api: { condition: service_healthy }
      mock-provider: { condition: service_started }

  # Stand-in SMS vendor: honours idempotency keys and posts signed delivery callbacks.
  mock-provider:
    <<: *server
    command: ["node", "build/workers/src/providers/mock-provider-server.js"]
    environment:
      PORT: "4010"
      MOCK_PROVIDER_API_KEY: mock-provider-key
      WEBHOOK_URL: http://api:3000/v1/webhooks/provider
      WEBHOOK_SIGNING_SECRET: dev-only-webhook-secret
      MOCK_FAIL_RATE: "0.05"
      MOCK_RATE_LIMIT_RATE: "0.02"
      MOCK_TIMEOUT_RATE: "0"
    ports:
      - "4010:4010"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: { condition: service_healthy }
      api-2: { condition: service_healthy }

volumes:
  db-data:
  redis-data:
