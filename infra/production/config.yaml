apiVersion: v1
kind: ConfigMap
metadata:
  name: gym-sms-config
data:
  NODE_ENV: production
  LOG_LEVEL: info
  RUN_MIGRATIONS: "false"       # the migrate Job owns schema changes
  SEED_DEMO_DATA: "false"
  SMS_PROVIDER: twilio
  SMS_PROVIDER_ACCOUNT: twilio-primary           # BullMQ queue (and rate limit) per Twilio account
  TWILIO_ACCOUNT_SID: ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx         # replace
  TWILIO_API_KEY_SID: SKxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx         # revocable API key; secret in the secret manager
  TWILIO_MESSAGING_SERVICE_SID: MGxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx  # sender pool, A2P/STOP compliance
  TWILIO_STATUS_CALLBACK_URL: https://webhooks.example.com/v1/webhooks/twilio
  TWILIO_WEBHOOK_PUBLIC_BASE_URL: https://webhooks.example.com     # must match what Twilio signs
  SMS_PROVIDER_TIMEOUT_MS: "10000"
  # Twilio's account/Messaging Service throughput (MPS), enforced queue-wide. Confirm with Twilio.
  PROVIDER_RATE_LIMIT_PER_SECOND: "100"
  # Twilio's Messages API has no idempotency key: ambiguous sends are resolved by lookup, then parked.
  PROVIDER_IDEMPOTENCY_WINDOW_MS: "0"
  WORKER_CONCURRENCY: "25"
  SEND_MAX_ATTEMPTS: "8"
  CLAIM_LEASE_MS: "60000"
  MISSED_SLOT_GRACE_MS: "600000"
  DISPATCH_BATCH_SIZE: "500"
  WEBHOOK_TOLERANCE_SEC: "300"
  WEBHOOK_RATE_LIMIT_PER_SECOND: "500"       # per API pod; the WAF limits globally
  RECEIPT_RETENTION_DAYS: "90"
  ATTEMPT_ARCHIVE_DAYS: "400"
  DEDUPE_RETENTION_DAYS: "400"
  PROVIDER_RETRY_WINDOW_DAYS: "30"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4318
