# Secrets live in the cloud secret manager and are synced into a Kubernetes Secret, which pods
# mount as files (*_FILE variables) rather than environment variables. Rotation: update the secret
# manager value; ESO refreshes the Secret; then `kubectl rollout restart` (or SIGHUP the API for
# webhook signing keys, which are re-read without a restart).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gym-sms-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cloud-secret-manager   # AWS Secrets Manager / GCP Secret Manager / Azure Key Vault
  target:
    name: gym-sms-secrets
  data:
    - secretKey: database-url          # postgres://app_user:...@host:5432/gym?sslmode=verify-full
      remoteRef: { key: gym-sms/database-url }
    - secretKey: migrate-database-url  # owner role, used only by the migration Job
      remoteRef: { key: gym-sms/migrate-database-url }
    - secretKey: redis-url             # rediss://... (TLS)
      remoteRef: { key: gym-sms/redis-url }
    - secretKey: redis-address         # host:port, for the KEDA queue-depth scaler
      remoteRef: { key: gym-sms/redis-address }
    - secretKey: redis-password
      remoteRef: { key: gym-sms/redis-password }
    - secretKey: twilio-api-key-secret    # workers: authenticate Messages API calls
      remoteRef: { key: gym-sms/twilio-api-key-secret }
    - secretKey: twilio-auth-tokens       # API: verify X-Twilio-Signature; "primary,secondary" while rotating
      remoteRef: { key: gym-sms/twilio-auth-tokens }
    - secretKey: webhook-signing-secrets  # "current,previous" during rotation
      remoteRef: { key: gym-sms/webhook-signing-secrets }
    - secretKey: admin-api-token
      remoteRef: { key: gym-sms/admin-api-token }
