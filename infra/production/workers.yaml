apiVersion: apps/v1
kind: Deployment
metadata:
  name: sms-worker
  labels: { app.kubernetes.io/name: sms-worker, app.kubernetes.io/part-of: gym-sms }
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: sms-worker } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: sms-worker, app.kubernetes.io/part-of: gym-sms }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "9464" }
    spec:
      # SIGTERM -> worker.close(): finish and record in-flight provider calls, take no new jobs.
      # Must exceed the provider timeout plus the database write.
      terminationGracePeriodSeconds: 60
      securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: gym-sms-server
          command: ["node", "build/workers/src/main.js"]
          ports: [{ name: metrics, containerPort: 9464 }]
          envFrom: [{ configMapRef: { name: gym-sms-config } }]
          env:
            - { name: DATABASE_URL_FILE, value: /secrets/database-url }
            - { name: REDIS_URL_FILE, value: /secrets/redis-url }
            - { name: TWILIO_API_KEY_SECRET_FILE, value: /secrets/twilio-api-key-secret }
            - { name: OTEL_SERVICE_NAME, value: gym-sms-worker }
          volumeMounts: [{ name: secrets, mountPath: /secrets, readOnly: true }]
          # Liveness must not fail because the SMS provider is down.
          livenessProbe: { httpGet: { path: /health/live, port: metrics }, periodSeconds: 15 }
          readinessProbe: { httpGet: { path: /health/ready, port: metrics }, periodSeconds: 10 }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 768Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
      volumes:
        - name: secrets
          secret: { secretName: gym-sms-secrets }
---
# Scale workers on queue backlog (KEDA Redis list scaler on BullMQ's wait list). Throughput is
# capped by the provider rate limit anyway; extra workers only help with provider latency.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: { name: sms-worker }
spec:
  scaleTargetRef: { name: sms-worker }
  minReplicaCount: 2
  maxReplicaCount: 12
  triggers:
    - type: redis
      authenticationRef: { name: redis-keda-auth }
      metadata:
        listName: bull:sms-send.twilio-primary:wait
        listLength: "500"
        enableTLS: "true"
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata: { name: redis-keda-auth }
spec:
  secretTargetRef:
    - { parameter: address, name: gym-sms-secrets, key: redis-address }
    - { parameter: password, name: gym-sms-secrets, key: redis-password }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: sms-worker }
spec:
  minAvailable: 1
  selector: { matchLabels: { app.kubernetes.io/name: sms-worker } }
